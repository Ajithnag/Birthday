<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Birthday Surprise</title>
  <style>
    :root {
      --pink: #e94d87;
      --purple: #8056c7;
      --text: #382842;
      --muted: #705f76;
      --background: #fff3f7;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #f1eaff);
    }

    .card {
      width: min(850px, 100%);
      padding: clamp(22px, 5vw, 42px);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 26px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 20px 60px rgba(90, 53, 112, .16);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: var(--pink);
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      line-height: 1.6;
    }

    .muted {
      color: var(--muted);
    }

    .page[hidden] {
      display: none;
    }

    .birthday-form {
      width: min(420px, 100%);
      margin: 28px auto 0;
    }

    label {
      display: block;
      margin-bottom: 9px;
      text-align: left;
      font-weight: 700;
    }

    input[type="date"] {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #dfd2e8;
      border-radius: 12px;
      background: white;
      color: var(--text);
      font: inherit;
    }

    button {
      padding: 13px 24px;
      border: 0;
      border-radius: 999px;
      color: white;
      background: linear-gradient(110deg, var(--pink), var(--purple));
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(132, 86, 216, .2);
    }

    button:hover {
      filter: brightness(1.05);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #bd9cf2;
      outline-offset: 3px;
    }

    .error {
      min-height: 1.5em;
      color: #b42345;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin: 26px 0;
    }

    .photos img {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 16px;
      background: #f3edf6;
      box-shadow: 0 8px 22px rgba(56, 40, 66, .12);
    }

    .cake {
      margin: 26px 0 4px;
      font-size: clamp(4rem, 12vw, 6rem);
      line-height: 1.2;
    }

    .note {
      margin: 12px auto 26px;
      max-width: 680px;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .video-frame {
      margin: 24px auto;
      max-width: 720px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      border-radius: 16px;
      background: #111;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .photos img {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- Date of birth screen -->
    <section id="datePage" class="page">
      <h1>A Birthday Surprise 🎁</h1>
      <p class="muted">Enter your date of birth to open your surprise.</p>

      <form id="birthdayForm" class="birthday-form">
        <label for="dobInput">Date of birth</label>
        <input id="dobInput" type="date" required />
        <p id="errorMessage" class="error" role="alert"></p>
        <button type="submit">See your surprise</button>
      </form>
    </section>

    <!-- Photos, cake, and note -->
    <section id="photosPage" class="page" hidden>
      <h1>Happy Birthday! 🎉</h1>
      <p class="muted">Here are some special memories for you.</p>

      <div id="photoGallery" class="photos"></div>

      <div class="cake" role="img" aria-label="Birthday cake">🎂</div>
      <h2>A little birthday wish</h2>
      <p id="birthdayNote" class="note"></p>

      <button id="nextButton" type="button">Next →</button>
    </section>

    <!-- Video -->
    <section id="videoPage" class="page" hidden>
      <h1>One More Surprise 🎥</h1>
      <div class="video-frame">
        <video id="birthdayVideo" controls playsinline preload="metadata">
          Your browser does not support video playback.
        </video>
      </div>
      <button id="backButton" type="button">← Back to photos and note</button>
    </section>
  </main>

  <script>
    /*
      Update these values before hosting the page.

      Example folder layout:
        index.html
        media/
          photo1.jpg
          photo2.jpg
          birthday-video.mp4
    */
    const BIRTHDAY = {
      // Use YYYY-MM-DD format, for example "2000-05-21".
      dateOfBirth: "2000-05-21",

      // Add the online paths or URLs for the photos.
      photos: [
        "media/photo1.jpg",
        "media/photo2.jpg"
      ],

      note: "Happy Birthday! Wishing you a wonderful day filled with happiness, laughter, and all the things you love.",

      // Use a video hosted online; keep it within your hosting provider's limits.
      video: "media/birthday-video.mp4"
    };

    const datePage = document.getElementById("datePage");
    const photosPage = document.getElementById("photosPage");
    const videoPage = document.getElementById("videoPage");
    const birthdayForm = document.getElementById("birthdayForm");
    const dobInput = document.getElementById("dobInput");
    const errorMessage = document.getElementById("errorMessage");
    const photoGallery = document.getElementById("photoGallery");
    const birthdayNote = document.getElementById("birthdayNote");
    const birthdayVideo = document.getElementById("birthdayVideo");

    function showPage(pageToShow) {
      [datePage, photosPage, videoPage].forEach(page => {
        page.hidden = page !== pageToShow;
      });
    }

    function prepareBirthdayContent() {
      photoGallery.replaceChildren();

      BIRTHDAY.photos.forEach((photoUrl, index) => {
        const image = document.createElement("img");
        image.src = photoUrl;
        image.alt = `Birthday photo ${index + 1}`;
        image.loading = "lazy";
        photoGallery.appendChild(image);
      });

      birthdayNote.textContent = BIRTHDAY.note;
      birthdayVideo.src = BIRTHDAY.video;
    }

    birthdayForm.addEventListener("submit", event => {
      event.preventDefault();
      errorMessage.textContent = "";

      if (dobInput.value !== BIRTHDAY.dateOfBirth) {
        errorMessage.textContent = "That date doesn't match. Please try again.";
        return;
      }

      prepareBirthdayContent();
      showPage(photosPage);
    });

    document.getElementById("nextButton").addEventListener("click", () => {
      showPage(videoPage);
    });

    document.getElementById("backButton").addEventListener("click", () => {
      birthdayVideo.pause();
      showPage(photosPage);
    });
  </script>
</body>
</html>
