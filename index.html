<script>
  const welcomePage = document.getElementById("welcomePage");
  const uploadPage = document.getElementById("uploadPage");
  const storyPage = document.getElementById("storyPage");

  const wishNote = document.getElementById("wishNote");
  const photoInput = document.getElementById("photoInput");
  const videoInput = document.getElementById("videoInput");
  const photoNames = document.getElementById("photoNames");
  const videoName = document.getElementById("videoName");
  const errorMessage = document.getElementById("errorMessage");

  const storyCard = document.getElementById("storyCard");
  const storyCount = document.getElementById("storyCount");
  const progressBar = document.getElementById("progressBar");
  const previousBtn = document.getElementById("previousBtn");
  const nextBtn = document.getElementById("nextBtn");

  const MAX_VIDEO_SIZE = 60 * 1024 * 1024;
  let items = [];
  let currentIndex = 0;
  let objectUrls = [];

  function showPage(page) {
    [welcomePage, uploadPage, storyPage].forEach(section => {
      section.classList.remove("active");
    });
    page.classList.add("active");
  }

  document.getElementById("goToUpload").addEventListener("click", () => {
    showPage(uploadPage);
  });

  document.getElementById("backToWelcome").addEventListener("click", () => {
    showPage(welcomePage);
  });

  photoInput.addEventListener("change", () => {
    const photos = Array.from(photoInput.files || []);
    photoNames.textContent = photos.length
      ? photos.map(file => file.name).join(", ")
      : "No photos selected.";
    errorMessage.textContent = "";
  });

  videoInput.addEventListener("change", () => {
    const video = videoInput.files[0];
    errorMessage.textContent = "";

    if (video && video.size > MAX_VIDEO_SIZE) {
      errorMessage.textContent =
        "The video is larger than 60 MB. Please choose a smaller video.";
      videoInput.value = "";
      videoName.textContent = "No video selected.";
      return;
    }

    videoName.textContent = video ? video.name : "No video selected.";
  });

  function buildStory() {
    errorMessage.textContent = "";

    const note = wishNote.value.trim();
    const photos = Array.from(photoInput.files || []);
    const video = videoInput.files[0];

    if (video && video.size > MAX_VIDEO_SIZE) {
      errorMessage.textContent =
        "The video is larger than 60 MB. Please choose a smaller video.";
      return;
    }

    if (!note && photos.length === 0 && !video) {
      errorMessage.textContent =
        "Add a note, at least one photo, or a video to build your story.";
      return;
    }

    objectUrls.forEach(url => URL.revokeObjectURL(url));
    objectUrls = [];
    items = [];

    // Story order: note, photos, then video.
    if (note) {
      items.push({ type: "note", content: note });
    }

    photos.forEach(file => {
      const url = URL.createObjectURL(file);
      objectUrls.push(url);
      items.push({ type: "image", content: url });
    });

    if (video) {
      const url = URL.createObjectURL(video);
      objectUrls.push(url);
      items.push({ type: "video", content: url });
    }

    currentIndex = 0;
    showPage(storyPage);
    renderItem();
  }

  function renderItem() {
    storyCard.replaceChildren();

    const item = items[currentIndex];
    if (!item) return;

    if (item.type === "note") {
      const wrapper = document.createElement("div");
      const label = document.createElement("div");
      const note = document.createElement("div");

      label.className = "story-label";
      label.textContent = "Birthday wish";

      note.className = "story-note";
      note.textContent = item.content;

      wrapper.append(label, note);
      storyCard.appendChild(wrapper);
    }

    if (item.type === "image") {
      const image = document.createElement("img");
      image.src = item.content;
      image.alt = "Birthday memory";
      storyCard.appendChild(image);
    }

    if (item.type === "video") {
      const video = document.createElement("video");
      video.src = item.content;
      video.controls = true;
      video.playsInline = true;
      storyCard.appendChild(video);
    }

    storyCount.textContent =
      `Birthday Story · ${currentIndex + 1} of ${items.length}`;

    progressBar.style.width =
      `${((currentIndex + 1) / items.length) * 100}%`;

    previousBtn.disabled = currentIndex === 0;
    previousBtn.style.opacity = currentIndex === 0 ? ".5" : "1";

    nextBtn.textContent =
      currentIndex === items.length - 1 ? "Start again ↻" : "Next →";
  }

  document.getElementById("buildStory").addEventListener("click", buildStory);

  previousBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderItem();
    }
  });

  nextBtn.addEventListener("click", () => {
    if (currentIndex < items.length - 1) {
      currentIndex++;
    } else {
      currentIndex = 0;
    }
    renderItem();
  });
</script>
