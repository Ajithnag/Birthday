<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Story Builder</title>
  <style>
    :root {
      --bg1: #fff3f8;
      --bg2: #f3ebff;
      --card: rgba(255,255,255,0.9);
      --pink: #f06292;
      --purple: #7c5ce6;
      --ink: #2d1e38;
      --muted: #6f5b76;
      --line: #e9dff3;
      --danger: #b42345;
      --green: #2d9b5b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(980px, 100%);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(58, 30, 72, 0.16);
      padding: 18px 18px 24px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }

    .tab {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.8);
      color: var(--ink);
      border-radius: 16px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      min-width: 130px;
      font-size: 1rem;
      transition: 0.2s ease;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: white;
      border-color: transparent;
      box-shadow: 0 8px 18px rgba(124, 92, 230, 0.25);
    }

    .page {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel {
      padding: 12px 10px 4px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      color: var(--pink);
      text-align: center;
    }

    .sub {
      text-align: center;
      color: var(--muted);
      margin: 0 0 22px;
      line-height: 1.6;
    }

    .field {
      margin: 18px 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    textarea, input[type="file"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      color: var(--ink);
      padding: 14px 16px;
      font: inherit;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .hint, .selected-files {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      overflow-wrap: anywhere;
    }

    .error {
      min-height: 20px;
      color: var(--danger);
      margin-top: 10px;
      font-size: 0.95rem;
    }

    .success {
      min-height: 20px;
      color: var(--green);
      margin-top: 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      padding: 13px 22px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(124, 92, 230, 0.18);
      transition: transform 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }

    button.secondary {
      background: #f5eefb;
      color: var(--ink);
      box-shadow: none;
    }

    .result-box {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-top: 14px;
      word-break: break-all;
      color: var(--ink);
    }

    .result-box input {
      width: 100%;
      border: none;
      background: transparent;
      font: inherit;
      color: var(--ink);
      outline: none;
    }

    .story {
      min-height: 360px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      padding: 18px;
      background: linear-gradient(135deg, #fff8fb, #f6efff);
      border: 1px solid var(--line);
    }

    .story video, .story img {
      display: block;
      max-width: 100%;
      max-height: 70vh;
      border-radius: 16px;
      background: #111;
    }

    .story .note {
      max-width: 720px;
      text-align: center;
      font-size: clamp(1.25rem, 3vw, 2rem);
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .story .gallery {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .story .gallery img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 9px 22px rgba(51, 27, 62, 0.12);
    }

    .story .icon {
      font-size: clamp(4rem, 12vw, 7rem);
      text-align: center;
    }

    .share-note {
      text-align: center;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.5;
    }

    body.shared-view .tabs {
      display: none;
    }

    @media (max-width: 620px) {
      .tabs { justify-content: center; }
      .tab { flex: 1 1 120px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="tabs">
      <button class="tab active" data-tab="make">🛠️ Make</button>
      <button class="tab" data-tab="seal">🧿 Seal</button>
      <button class="tab" data-tab="sent">📤 Sent</button>
      <button class="tab" data-tab="open">🔓 Open</button>
    </div>

    <section id="makePage" class="page active">
      <div class="panel">
        <h2>Make</h2>
        <p class="sub">Upload a birthday note, several photos, and one video up to 60 MB.</p>

        <div class="field">
          <label for="noteInput">Birthday note</label>
          <textarea id="noteInput" placeholder="Happy Birthday! ..."></textarea>
        </div>

        <div class="field">
          <label for="photoInput">Photos</label>
          <input id="photoInput" type="file" accept="image/*" multiple />
          <p id="photoStatus" class="selected-files">No photos selected.</p>
        </div>

        <div class="field">
          <label for="videoInput">Video (max 60 MB)</label>
          <input id="videoInput" type="file" accept="video/*" />
          <p id="videoStatus" class="selected-files">No video selected.</p>
        </div>

        <div id="makeError" class="error"></div>
        <div id="makeSuccess" class="success"></div>

        <div class="actions">
          <button id="sealButton" class="secondary" type="button">Seal</button>
          <button id="submitButton" type="button">Sent</button>
        </div>
      </div>
    </section>

    <section id="sealPage" class="page">
      <div class="panel">
        <h2>Seal</h2>
        <p class="sub">Your birthday content is saved as a draft.</p>
        <div id="sealMessage" class="success"></div>
        <div class="actions">
          <button id="sealToMake" type="button" class="secondary">Back to Make</button>
        </div>
      </div>
    </section>

    <section id="sentPage" class="page">
      <div class="panel">
        <h2>Sent</h2>
        <p class="sub">This is your shareable URL.</p>

        <div id="sentMessage" class="success"></div>

        <div class="result-box">
          <input id="shareUrl" readonly value="" />
        </div>

        <div class="actions">
          <button id="copyUrlButton" type="button" class="secondary">Copy URL</button>
          <button id="openSentUrlButton" type="button">Open URL</button>
        </div>
      </div>
    </section>

    <section id="openPage" class="page">
      <div class="panel">
        <h2>Open</h2>
        <p id="openMessage" class="share-note"></p>
        <div id="openStory" class="story"></div>
      </div>
    </section>
  </div>
