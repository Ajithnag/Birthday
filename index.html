<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Birthday Surprise Builder</title>
  <style>
    :root {
      --bg1: #fff3f8;
      --bg2: #f1eaff;
      --card: rgba(255,255,255,0.92);
      --pink: #f06292;
      --purple: #7c5ce6;
      --ink: #2d1e38;
      --muted: #6f5b76;
      --line: #eadff5;
      --danger: #b42345;
      --success: #237d4b;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(1000px, 100%);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 28px;
      box-shadow: 0 18px 48px rgba(58, 30, 72, 0.14);
      padding: 18px 18px 24px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    body.shared-view .tabs {
      display: none;
    }

    .tab {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 16px;
      min-width: 120px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border-color: transparent;
      color: white;
      box-shadow: 0 8px 18px rgba(124,92,230,0.22);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .panel {
      padding: 10px 6px 4px;
    }

    h1 {
      text-align: center;
      margin: 0 0 14px;
      color: var(--pink);
      font-size: clamp(2rem, 5vw, 3rem);
    }

    h2 {
      text-align: center;
      margin: 0 0 12px;
      color: var(--pink);
      font-size: clamp(1.5rem, 4vw, 2.4rem);
    }

    .lead {
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 18px;
    }

    .field {
      margin: 18px 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    textarea, input[type="file"] {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .hint, .file-status {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      overflow-wrap: anywhere;
    }

    .message {
      min-height: 1.4em;
      margin-top: 12px;
      text-align: center;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    button, .link-btn {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 13px 22px;
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 10px 20px rgba(124,92,230,0.18);
    }

    button.secondary, .link-btn.secondary {
      background: #f3edf7;
      color: var(--ink);
      box-shadow: none;
    }

    .preview-box {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 14px;
      word-break: break-all;
      color: var(--ink);
    }

    .preview-box a {
      color: var(--purple);
      text-decoration: none;
      word-break: break-all;
    }

    .story {
      min-height: 360px;
      display: grid;
      place-items: center;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(135deg, #fff8fb, #f6efff);
    }

    .story video, .story img {
      display: block;
      width: 100%;
      max-height: 70vh;
      border-radius: 16px;
      background: #111;
    }

    .story .note {
      max-width: 700px;
      text-align: center;
      font-size: clamp(1.25rem, 3vw, 2rem);
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .story .gallery {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .story .gallery img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(56,40,66,0.12);
    }

    .slide-count {
      text-align: center;
      color: var(--muted);
      margin-top: 14px;
    }

    @media (max-width: 620px) {
      .tab {
        flex: 1 1 40%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="tabs" aria-label="Birthday steps">
      <button class="tab active" type="button" data-step="make">🛠️ Make</button>
      <button class="tab" type="button" data-step="seal">🧿 Seal</button>
      <button class="tab" type="button" data-step="sent">📤 Sent</button>
      <button class="tab" type="button" data-step="open">🔓 Open</button>
    </nav>

    <section id="makePage" class="page active">
      <div class="panel">
        <h1>Make your birthday surprise</h1>
        <p class="lead">
          Add a note, some photos, and one video. Click Seal to save, then Sent to make a URL.
        </p>

        <div class="field">
          <label for="noteInput">Birthday note</label>
          <textarea id="noteInput" placeholder="Happy Birthday!"></textarea>
        </div>

        <div class="field">
          <label for="photoInput">Photos</label>
          <input id="photoInput" type="file" accept="image/*" multiple />
          <p id="photoStatus" class="file-status">No photos selected.</p>
        </div>

        <div class="field">
          <label for="videoInput">One video (max 60 MB)</label>
          <input id="videoInput" type="file" accept="video/*" />
          <p id="videoStatus" class="file-status">No video selected.</p>
        </div>

        <p id="makeMessage" class="message" role="status"></p>

        <div class="actions">
          <button id="sealButton" type="button">🧿 Seal and save</button>
        </div>
      </div>
    </section>

    <section id="sealPage" class="page">
      <div class="panel">
        <h2>🧿 Seal</h2>
        <p class="lead">Your draft is saved in this browser.</p>
        <p id="sealMessage" class="message success"></p>

        <div class="actions">
          <button id="backToMake" class="secondary" type="button">Back to Make</button>
          <button id="sendButton" type="button">📤 Sent</button>
        </div>
      </div>
    </section>

    <section id="sentPage" class="page">
      <div class="panel">
        <h2>📤 Sent</h2>
        <p id="sentMessage" class="lead">A new URL will appear here after submission.</p>

        <div class="preview-box">
          <a id="shareLink" href="#" target="_blank" rel="noopener" hidden></a>
        </div>

        <div class="actions">
          <button id="copyUrlButton" class="secondary" type="button">Copy URL</button>
          <a id="openShareLink" class="link-btn" href="#" target="_blank" rel="noopener" hidden>Open URL</a>
        </div>
      </div>
    </section>

    <section id="openPage" class="page">
      <div class="panel">
        <h2>🔓 Open</h2>
        <p id="openMessage" class="lead"></p>
        <div id="storyContent" class="story"></div>
        <p id="slideCount" class="slide-count"></p>
        <div id="openActions" class="actions">
          <button id="prevButton" class="secondary" type="button">← Previous</button>
          <button id="nextButton" type="button">Next →</button>
        </div>
      </div>
    </section>
  </main>
