<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Surprise</title>
  <style>
    :root {
      --pink: #e94d87;
      --purple: #8056c7;
      --text: #382842;
      --muted: #705f76;
      --bg1: #fff0f5;
      --bg2: #f1eaff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .card {
      width: min(900px, 100%);
      padding: clamp(20px, 5vw, 42px);
      border-radius: 28px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 20px 60px rgba(90, 53, 112, 0.15);
      border: 1px solid rgba(255,255,255,0.9);
    }

    h1 {
      margin: 0 0 14px;
      color: var(--pink);
      text-align: center;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    .subtitle {
      color: var(--muted);
      text-align: center;
      margin: 0 0 20px;
      line-height: 1.6;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin: 24px 0 30px;
    }

    .photos img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 16px;
      background: #f5edf8;
      box-shadow: 0 8px 24px rgba(56, 40, 66, 0.12);
    }

    .cake {
      font-size: clamp(4rem, 12vw, 6rem);
      text-align: center;
      margin: 10px 0 4px;
    }

    .wish-title {
      text-align: center;
      font-size: clamp(1.3rem, 4vw, 2rem);
      margin: 0 0 12px;
    }

    .note {
      max-width: 700px;
      margin: 0 auto 24px;
      text-align: center;
      font-size: clamp(1.15rem, 3vw, 1.8rem);
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    button {
      border: none;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(110deg, var(--pink), var(--purple));
      font: inherit;
      font-weight: 700;
      padding: 13px 24px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(132, 86, 216, 0.2);
    }

    button:hover {
      filter: brightness(1.05);
    }

    .video-section {
      display: none;
      margin-top: 10px;
      text-align: center;
    }

    .video-section.active {
      display: block;
    }

    .video-box {
      max-width: 720px;
      margin: 0 auto;
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      border-radius: 18px;
      background: #111;
    }

    @media (max-width: 520px) {
      .photos img {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Happy Birthday! 🎉</h1>
    <p class="subtitle">Here are some special memories for you.</p>

    <div id="photoGallery" class="photos"></div>

    <div class="cake" aria-label="Birthday cake">🎂</div>
    <h2 class="wish-title">A birthday wish for you</h2>
    <p id="birthdayNote" class="note"></p>

    <div class="actions">
      <button id="nextButton" type="button">Next →</button>
    </div>

    <div id="videoSection" class="video-section">
      <h2>One More Surprise 🎥</h2>
      <div class="video-box">
        <video id="birthdayVideo" controls playsinline preload="metadata">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
  </main>

  <script>
    /*
      Replace these with your own online media paths.
      Make sure the files are uploaded to your hosting service and accessible publicly.
      Example folder:
        index.html
        media/
          photo1.jpg
          photo2.jpg
          birthday-video.mp4
    */

    const birthdayContent = {
      photos: [
        "media/photo1.jpg",
        "media/photo2.jpg",
        "media/photo3.jpg"
      ],
      note: "Happy Birthday! Wishing you a life full of joy, success, laughter, and endless beautiful memories. May every dream you hold come true and may your heart always be full of happiness.",
      video: "media/birthday-video.mp4"
    };

    const photoGallery = document.getElementById("photoGallery");
    const birthdayNote = document.getElementById("birthdayNote");
    const nextButton = document.getElementById("nextButton");
    const videoSection = document.getElementById("videoSection");
    const birthdayVideo = document.getElementById("birthdayVideo");

    function loadMedia() {
      birthdayContent.photos.forEach((photoUrl, index) => {
        const img = document.createElement("img");
        img.src = photoUrl;
        img.alt = `Birthday memory ${index + 1}`;
        img.loading = "lazy";
        photoGallery.appendChild(img);
      });

      birthdayNote.textContent = birthdayContent.note;
      birthdayVideo.src = birthdayContent.video;
    }

    nextButton.addEventListener("click", () => {
      videoSection.classList.add("active");
      nextButton.style.display = "none";
      birthdayVideo.play();
    });

    loadMedia();
  </script>
</body>
</html>
